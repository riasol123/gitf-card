<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Подарочный код с сакурой</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<!-- Nunito -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow-x: hidden; /* убираем горизонтальный скролл */
}

body {
  background: #89A064;
  font-family: 'Nunito', sans-serif;
}

/* падающая сакура */
.sakura {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.sakura span {
  position: absolute;
  top: -10%;
  width: 1vw;
  height: 0.5vw;
  border-radius: 5% 80% 10% 80%;
  background-color: #ffb6c1;
  animation: sakura-fall linear infinite;
}

@keyframes sakura-anim-1 {
  0% { top: -10%; transform: translateX(0) rotateX(0) rotateY(0); }
  100% { top: 100%; transform: translateX(15vw) rotateX(180deg) rotateY(360deg); }
}
@keyframes sakura-anim-2 {
  0% { top: -10%; transform: translateX(0); }
  100% { top: 100%; transform: translateX(-15vw) rotateX(180deg) rotateY(360deg); }
}

/* Верхняя надпись вне карточки */
.header-text {
  text-align: center;
  font-size: 30px;
  font-weight: 700;
  color: #ffffff;
  margin-top: 5vh;
  margin-bottom: 4vh; /* расстояние до карточки */
  z-index: 1;
  position: relative;
}

/* карточка */
.wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0 16px 5vh 16px;
  position: relative;
  z-index: 1; /* поверх лепестков */
}

.card {
  width: 100%;
  max-width: 360px;
  background: #ffffff;
  border-radius: 22px;
  padding: 26px 22px;
  box-shadow: 0 14px 36px rgba(0,0,0,0.15);
}

.field {
  margin-bottom: 18px;
}

.label {
  font-size: 15px;
  color: #8A6350;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
  font-weight: 600;
}

.value-row {
  display: flex;
  gap: 10px;
  align-items: center;
  background: #F6EFEA;
  border-radius: 14px;
  padding: 14px;
}

.value {
  flex: 1;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #8A6350;
}

button {
  border: none;
  background: #D19397;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

button i {
  color: #ffffff;
}

button:active {
  transform: scale(0.97);
  opacity: 0.9;
}

.copied {
  text-align: center;
  font-size: 13px;
  color: #89A064;
  margin-top: 14px;
  display: none;
  font-weight: 600;
}

/* мобильные лепестки больше */
@media (max-width: 480px) {
  .sakura span {
    width: 2vw;
    height: 1vw;
  }
}
</style>
</head>
<body>

<!-- падающая сакура -->
<div class="sakura">
  <span style="left:1%; animation-name:sakura-anim-1; animation-duration:8s; animation-delay:0s;"></span>
  <span style="left:5%; animation-name:sakura-anim-2; animation-duration:10s; animation-delay:1s;"></span>
  <span style="left:10%; animation-name:sakura-anim-1; animation-duration:9s; animation-delay:2s;"></span>
  <span style="left:15%; animation-name:sakura-anim-2; animation-duration:12s; animation-delay:3s;"></span>
  <span style="left:20%; animation-name:sakura-anim-1; animation-duration:11s; animation-delay:4s;"></span>
  <span style="left:25%; animation-name:sakura-anim-2; animation-duration:10s; animation-delay:0.5s;"></span>
  <span style="left:30%; animation-name:sakura-anim-1; animation-duration:9s; animation-delay:1.5s;"></span>
  <span style="left:35%; animation-name:sakura-anim-2; animation-duration:11s; animation-delay:2.5s;"></span>
  <span style="left:40%; animation-name:sakura-anim-1; animation-duration:12s; animation-delay:3.5s;"></span>
  <span style="left:45%; animation-name:sakura-anim-2; animation-duration:8s; animation-delay:4.5s;"></span>
</div>

<!-- Верхняя надпись -->
<div class="header-text">Сертификат lamoda</div>

<!-- карточка -->
<div class="wrapper">
  <div class="card">
    <div class="field">
      <div class="label">Номер сертификата</div>
      <div class="value-row">
        <div class="value" id="code">GIFT000000-0000</div>
        <button onclick="copy('code')">
          <i class="fa-solid fa-copy"></i>
        </button>
      </div>
    </div>

    <div class="field">
      <div class="label">Пин-код</div>
      <div class="value-row">
        <div class="value" id="pin">0000</div>
        <button onclick="copy('pin')">
          <i class="fa-solid fa-copy"></i>
        </button>
      </div>
    </div>

    <div class="copied" id="copied">Скопировано ✓</div>
  </div>
</div>

<script>
function copy(id) {
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text).then(() => {
    const note = document.getElementById('copied');
    note.style.display = 'block';
    setTimeout(() => note.style.display = 'none', 1400);
  });
}
</script>

</body>
</html>
