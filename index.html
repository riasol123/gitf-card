<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Подарочный код</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <!-- Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #89A064;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* wrapper растягивает карточку на весь экран */
    .wrapper {
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* одинаковые отступы сверху и снизу */
      width: 100%;
      min-height: 100vh;
      padding: 5vh 0; /* сверху и снизу 5% высоты экрана */
      box-sizing: border-box;
      align-items: center;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      border-radius: 22px;
      padding: 26px 22px;
      box-shadow: 0 14px 36px rgba(0,0,0,0.15);
      flex-grow: 1; /* растягиваем на доступное пространство */
      display: flex;
      flex-direction: column;
      justify-content: center; /* контент по центру */
    }

    h1 {
      text-align: center;
      font-size: 17px;
      margin: 0 0 22px;
      font-weight: 700;
      color: #8A6350;
    }

    .field {
      margin-bottom: 18px;
    }

    .label {
      font-size: 11px;
      color: #8A6350;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .value-row {
      display: flex;
      gap: 10px;
      align-items: center;
      background: #F6EFEA;
      border-radius: 14px;
      padding: 14px;
    }

    .value {
      flex: 1;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #8A6350;
    }

    button {
      border: none;
      background: #D19397;
      color: #ffffff;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .copied {
      text-align: center;
      font-size: 13px;
      color: #89A064;
      margin-top: 14px;
      display: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="card">
      <h1>Ваш подарочный код</h1>

      <div class="field">
        <div class="label">КОД</div>
        <div class="value-row">
          <div class="value" id="code">GIFT122</div>
          <button onclick="copy('code')">📋</button>
        </div>
      </div>

      <div class="field">
        <div class="label">PIN</div>
        <div class="value-row">
          <div class="value" id="pin">1234</div>
          <button onclick="copy('pin')">📋</button>
        </div>
      </div>

      <div class="copied" id="copied">Скопировано ✓</div>
    </div>
  </div>

  <script>
    function copy(id) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const note = document.getElementById('copied');
        note.style.display = 'block';
        setTimeout(() => note.style.display = 'none', 1400);
      });
    }
  </script>

</body>
</html>
