<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Подарочный код</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <style>
    body {
      margin: 0;
      background: #f2f3f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 360px;
      margin: 16px;
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      font-size: 17px;
      margin: 0 0 22px;
      font-weight: 600;
    }

    .field {
      margin-bottom: 18px;
    }

    .label {
      font-size: 11px;
      color: #888;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .value-row {
      display: flex;
      gap: 10px;
      align-items: center;
      background: #f1f3f5;
      border-radius: 14px;
      padding: 14px;
    }

    .value {
      flex: 1;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    button {
      border: none;
      background: #000;
      color: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    .copied {
      text-align: center;
      font-size: 13px;
      color: #2e7d32;
      margin-top: 14px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Ваш подарочный код</h1>

    <div class="field">
      <div class="label">КОД</div>
      <div class="value-row">
        <div class="value" id="code">GIFT122</div>
        <button onclick="copy('code')">Копировать</button>
      </div>
    </div>

    <div class="field">
      <div class="label">PIN</div>
      <div class="value-row">
        <div class="value" id="pin">1234</div>
        <button onclick="copy('pin')">Копировать</button>
      </div>
    </div>

    <div class="copied" id="copied">Скопировано ✓</div>
  </div>

  <script>
    function copy(id) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const note = document.getElementById('copied');
        note.style.display = 'block';
        setTimeout(() => note.style.display = 'none', 1400);
      });
    }
  </script>

</body>
</html>
