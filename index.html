<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Подарочный код с сакурой</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<!-- Nunito -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    background: #89A064;
    font-family: 'Nunito', sans-serif;
    overflow-x: hidden;
  }

  /* падающая сакура */
  .sakura {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none; /* не мешает кликам */
    z-index: 0; /* под карточкой */
  }

  .sakura span {
    position: absolute;
    top: -10%;
    width: 1.4vw;
    height: 0.7vw;
    border-radius: 5% 80% 10% 80%;
    background-color: #ffb6c1;
    animation-name: sakura-fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @media (max-width: 480px) {
    .sakura span {
      width: 2.4vw;   /* увеличиваем ширину */
      height: 1.7vw;  /* увеличиваем высоту */
    }
  }

  @keyframes sakura-anim-1 {
    0% { top: -10%; transform: translateX(0) rotateX(0) rotateY(0); }
    100% { top: 100%; transform: translateX(15vw) rotateX(180deg) rotateY(360deg); }
  }
  @keyframes sakura-anim-2 {
    0% { top: -10%; transform: translateX(0); }
    100% { top: 100%; transform: translateX(-15vw) rotateX(180deg) rotateY(360deg); }
  }

  /* карточка */
  .wrapper {
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 5vh 16px;
    box-sizing: border-box;
    align-items: center;
    position: relative;
    z-index: 1; /* поверх лепестков */
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: #ffffff;
    border-radius: 22px;
    padding: 26px 22px;
    box-shadow: 0 14px 36px rgba(0,0,0,0.15);
  }

  h1 {
    text-align: center;
    font-size: 17px;
    margin: 0 0 22px;
    font-weight: 700;
    color: #8A6350;
  }

  .field {
    margin-bottom: 18px;
  }

  .label {
    font-size: 11px;
    color: #8A6350;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .value-row {
    display: flex;
    gap: 10px;
    align-items: center;
    background: #F6EFEA;
    border-radius: 14px;
    padding: 14px;
  }

  .value {
    flex: 1;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #8A6350;
  }

  button {
    border: none;
    background: #D19397;
    color: #ffffff;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
  }

  button:active {
    transform: scale(0.97);
    opacity: 0.9;
  }

  .copied {
    text-align: center;
    font-size: 13px;
    color: #89A064;
    margin-top: 14px;
    display: none;
    font-weight: 600;
  }
</style>
</head>
<body>

<!-- падающая сакура -->
<div class="sakura">
  <!-- 50 лепестков с разной позицией, задержкой и скоростью -->
  <span style="left:1%; animation-name:sakura-anim-1; animation-duration:8s; animation-delay:0s;"></span>
  <span style="left:5%; animation-name:sakura-anim-2; animation-duration:10s; animation-delay:1s;"></span>
  <span style="left:10%; animation-name:sakura-anim-1; animation-duration:9s; animation-delay:2s;"></span>
  <span style="left:15%; animation-name:sakura-anim-2; animation-duration:12s; animation-delay:3s;"></span>
  <span style="left:20%; animation-name:sakura-anim-1; animation-duration:11s; animation-delay:4s;"></span>
  <span style="left:25%; animation-name:sakura-anim-2; animation-duration:10s; animation-delay:0.5s;"></span>
  <span style="left:30%; animation-name:sakura-anim-1; animation-duration:9s; animation-delay:1.5s;"></span>
  <span style="left:35%; animation-name:sakura-anim-2; animation-duration:11s; animation-delay:2.5s;"></span>
  <span style="left:40%; animation-name:sakura-anim-1; animation-duration:12s; animation-delay:3.5s;"></span>
  <span style="left:45%; animation-name:sakura-anim-2; animation-duration:8s; animation-delay:4.5s;"></span>
  <span style="left:50%; animation-name:sakura-anim-1; animation-duration:10s; animation-delay:0.2s;"></span>
  <span style="left:55%; animation-name:sakura-anim-2; animation-duration:9s; animation-delay:1.2s;"></span>
  <span style="left:60%; animation-name:sakura-anim-1; animation-duration:12s; animation-delay:2.2s;"></span>
  <span style="left:65%; animation-name:sakura-anim-2; animation-duration:10s; animation-delay:3.2s;"></span>
  <span style="left:70%; animation-name:sakura-anim-1; animation-duration:11s; animation-delay:4.2s;"></span>
  <span style="left:75%; animation-name:sakura-anim-2; animation-duration:9s; animation-delay:0.7s;"></span>
  <span style="left:80%; animation-name:sakura-anim-1; animation-duration:12s; animation-delay:1.7s;"></span>
  <span style="left:85%; animation-name:sakura-anim-2; animation-duration:8s; animation-delay:2.7s;"></span>
  <span style="left:90%; animation-name:sakura-anim-1; animation-duration:10s; animation-delay:3.7s;"></span>
  <span style="left:95%; animation-name:sakura-anim-2; animation-duration:11s; animation-delay:4.7s;"></span>
  <!-- можно дублировать до 50-60 лепестков для плотного эффекта -->
</div>

<!-- карточка -->
<div class="wrapper">
  <div class="card">
    <h1>Ваш подарочный код</h1>

    <div class="field">
      <div class="label">КОД</div>
      <div class="value-row">
        <div class="value" id="code">GIFT122</div>
        <button onclick="copy('code')">Скопировать</button>
      </div>
    </div>

    <div class="field">
      <div class="label">PIN</div>
      <div class="value-row">
        <div class="value" id="pin">1234</div>
        <button onclick="copy('pin')">Скопировать</button>
      </div>
    </div>

    <div class="copied" id="copied">Скопировано ✓</div>
  </div>
</div>

<script>
function copy(id) {
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text).then(() => {
    const note = document.getElementById('copied');
    note.style.display = 'block';
    setTimeout(() => note.style.display = 'none', 1400);
  });
}
</script>

</body>
</html>
